name: velora-producer

networks:
  velora-producer-net:
    driver: bridge

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: velora-zookeeper
    networks: [velora-producer-net]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: -Dzookeeper.4lw.commands.whitelist=*
    ports:
      - "2181:2181"
    volumes:
      # Explicit named volumes — without these, Confluent image creates
      # anonymous volumes that survive `--force-recreate` and cause
      # `NodeExistsException` on broker re-registration.
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc -w 2 localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: velora-kafka
    depends_on:
      - zookeeper
    networks: [velora-producer-net]
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # 3 listeners:
      #   INTERNAL — for in-network containers (cross-broker on same compose network)
      #   LOCAL    — for HOST processes via localhost:9092 (producer/consumer/seed Python)
      #   DOCKER   — for OTHER containers (Spark) via host.docker.internal:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,LOCAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,LOCAL://0.0.0.0:9092,DOCKER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,LOCAL://${HOST_LAN_IP:-localhost}:9092,DOCKER://host.docker.internal:9094
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 6
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 15

  # One-shot init: creates the 3 velora topics w/ 6 partitions each, then exits.
  # Spark Structured Streaming subscribes via KafkaAdminClient which ⊥ auto-create on
  # subscribe — must exist before Spark connects. (Broker-side AUTO_CREATE_TOPICS_ENABLE
  # only fires on PRODUCE, not AdminClient.describeTopics.)
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: velora-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    networks: [velora-producer-net]
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in velora.prices velora.tweets velora.sentiment; do
          kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$t" --partitions 6 --replication-factor 1
        done
        echo "kafka-init: topics ready"
    restart: "no"
